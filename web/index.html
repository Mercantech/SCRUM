<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mercantec-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SCRUM på Mercantec MAGS — Issues, Projects, Releases og gradvis introduktion fra H1 til H6."
    />
    <meta name="color-scheme" content="dark light" />
    <title>SCRUM · Mercantec MAGS</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("scrum-theme")
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark"
          document.documentElement.setAttribute("data-theme", theme)
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark")
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
