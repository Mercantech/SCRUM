services:
  web:
    build: ./web
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.scrum-web.rule=Host(`${TRAEFIK_HOST:-scrum.mercantec.tech}`)
      - traefik.http.routers.scrum-web.entrypoints=web
      - traefik.http.services.scrum-web.loadbalancer.server.port=3000
      - traefik.docker.network=dokploy-network

networks:
  dokploy-network:
    external: true
